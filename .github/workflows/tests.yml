name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q app tests

      - name: Rodar a suíte (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -q

  empacotamento:
    name: build PyInstaller (Windows) · informativo
    runs-on: windows-latest
    # Não bloqueia o main: o empacotamento é informativo e o build pode
    # quebrar por causa externa (versão do PyInstaller, antivírus, etc).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (pasta)
        working-directory: packaging
        continue-on-error: true
        run: pyinstaller auto_draw_studio.spec

      - name: Conferir o executável
        continue-on-error: true
        run: |
          $exe = "packaging/dist/AutoDrawStudio/AutoDrawStudio.exe"
          if (-not (Test-Path $exe)) { throw "Executável não gerado: $exe" }
          Write-Host "OK: $exe ($((Get-Item $exe).Length) bytes)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoDrawStudio-windows
          path: packaging/dist/AutoDrawStudio/
          if-no-files-found: ignore
          retention-days: 14
